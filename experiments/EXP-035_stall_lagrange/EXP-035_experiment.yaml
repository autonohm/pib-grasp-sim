ergebnis: 'Leistung 84 % [81–86] (ggü. EXP-027 kein Unterschied, P = 0,67), nur 2/5 (s42/43/46 halten, aber gekippt; Kippen alle
  Seeds 48°). Erfolgreiche Seeds: Servo-Last 13 % (EXP-027 40 %), Griffkraft 57 N (97), Unruhe 0,16, Kippen 28°, Schutz > 2 s
  87 %, Transport 95 % (s44 98, s45 92). λ steigt bis It. 100–200 auf 5–8, fällt bis It. 300 auf 2–5; J_c im Training am Ende
  0,16–0,18 (≤ 0,2). Rauschen σ sinkt auf 0,39–0,46 (EXP-027 0,71–0,87). Stall je Servo: die Last sammelt sich auf einem
  Servo (Zeigefinger 95–97 % oder Daumen 35–55 % der Zeit), die übrigen ≤ 5 %.'
urteil: 'kein Unterschied, Stall-Grenze wirkt im Mittel — Bestandteil der Basis (bestätigt 2026-10-14)'
schluss: 'Mittel-Grenze wirkt (J_c ≤ 0,2, Griffkraft −40 %), der Überlastschutz aber kaum: Kosten = Anteil der Servos
  erlauben einen Servo im Dauer-Stall (1/7 = 14 % < 20 %). Für den Schutz braucht es eine Grenze je Servo (je ein λ) oder
  Kosten auf die Lauflänge > 2 s. Zuverlässigkeit 2/5 nicht trennscharf (EXP-027 ebenfalls 2/5).'
