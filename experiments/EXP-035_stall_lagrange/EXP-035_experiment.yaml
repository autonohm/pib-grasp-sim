# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-035
titel: 'Servo-Stall: PID-Lagrange auf den Stall-Anteil (Grenze 20 %)'
datum: '2026-10-12'
eltern: EXP-027
status: ausgewertet
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'EXP-027 liegt fast immer im Stall (Daumen, Zeige- und kleiner Finger 82–98
  % der Schritte ≥ 90 % Moment); die echten ST3215 schalten nach > 2 s über 80 % Blockiermoment
  ab und werden heiß. Eine feste Moment-Strafe blieb wirkungslos (EXP-025, Gewicht
  falsch); PID-Lagrange (Stooke et al. 2020, Safety Gym) stellt das Gewicht selbst
  ein: Anteil der Servos ≥ 80 % sinkt auf ≈ 20 %, Stall-Dauer und Schutz-Anteil sinken
  deutlich, Leistung gleich, Transport ≥ 97 % (EXP-024).'
aenderung: 'Belohnungsterm mdp.StallLagrange: −λ·c_t mit c_t = Anteil der 7 Servos
  (ohne Handgelenk) mit |τ| ≥ 80 % Stall, λ ≥ 0 per PID je Rollout auf J_c ≤ 0,2 (K_P
  10, K_I 1, K_D 5, EMA 0,5, λ ≤ 100; env_cfg.STALL_LAGRANGE), λ und J_c im TensorBoard
  (Lagrange/…). Agent wie EXP-027 (Task HeavyMultiProgressDexLagrange-v0).'
