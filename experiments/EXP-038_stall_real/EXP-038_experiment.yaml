# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-038
titel: Stall-Kosten wie am echten Servo (8 Servos inkl. Handgelenk, kein Drücken am
  Anschlag)
datum: '2026-10-13'
eltern: EXP-036
status: geplant                 # geplant | läuft | ausgewertet | verworfen

# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Die Stall-Kosten messen, was den echten Servo belastet: mit dem Handgelenk (bisher nie gemessen) und ohne Drücken gegen den Anschlag (die Firmware kappt dort). Vor dem Griff entfallen so Kosten, die nur aus Erkundung bestehen. Erwartet: Leistung und Zuverlässigkeit mindestens wie EXP-036 (nicht gesichert schlechter, ≥ 4/5), Servo-Last real ≤ EXP-036, Unruhe ≤ 0,1, Transport ≥ 95 %.'
aenderung: 'Stall-Kosten wie am echten Servo: 8 Servos inkl. Handgelenk (Stall-Moment über das Pleuel), kein Stall ≤ 1° vor der Gelenkgrenze in Momentrichtung (Task HeavyMultiProgressDexCapsLagrangeReal-v0).'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d6
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
