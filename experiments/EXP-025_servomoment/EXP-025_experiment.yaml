# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Alle Policies halten mit vollem Moment (Stall 97–99 %, Griffkraft 83–130 N), weil nichts die Kraft kostet. Für die
  echte Hand schädlich (ST3215 im Dauer-Stall: Wärme, Strom, Überlastschutz). Eine Strafe auf das normierte Servo-Moment
  wie HORA (Moment-Strafe) senkt Stall-Anteil und Griffkraft deutlich, ohne die Leistung zu verlieren.'
aenderung: 'Belohnungsterm servo_torque = W · Σ(τ/τ_Stall)² über die 7 Servos außer Handgelenk (mdp.servo_torque_l2, wie die
  Leitplanke Stall-Anteil), ganze Episode; W = −0,1 (reward_diag mit EXP-022 s42: servo_torque −0,41/−0,47 je s vor dem Absenken/
  in der Haltephase ggü. Gegengriff 0,39/0,49 — Dauer-Stall kostet etwa den Gegengriff; Env HeavyMultiProgressTorque,
  Agent Clip). Sonst wie EXP-022.'
