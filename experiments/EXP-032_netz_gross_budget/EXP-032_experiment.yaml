ergebnis: 'Leistung 85 % [82–87] (ggü. EXP-031 gesichert besser, P = 0,82; ggü. EXP-024 87 % kein Unterschied), 5/5 Seeds; Kippwinkel 30°, Unterarm 43° (EXP-031: 41°/53°), Robust 55 %, Objektweg 120 mm, Servo-Last 55 %; Leitplanke Unruhe verletzt (3,85, an den Servos 1,07; EXP-031: 0,86/0,32) bei gleichem Aktionsrauschen (σ ≈ 0,8). Trainingsterm success 3,3–3,8 (EXP-031: 1,8–2,3). Index v3 seitlich 0,08.'
urteil: 'kein Unterschied zu EXP-024 (gesichert besser als EXP-031), Leitplanke Unruhe verletzt — nicht übernommen (bestätigt 2026-10-14)'
schluss: 'Hypothese bestätigt für die Leistung — das große Netz profitiert vom 8-fachen Budget (+10 PP ggü. EXP-031, 5/5), Kippen und Unterarm gehen zurück, bleiben aber über EXP-024 (13°/11°) bei gleicher Leistung. Preis: deutlich unruhiger (Mittelwert der Policy springt, nicht das Rauschen), Leitplanke verletzt. Mehr Budget löst das Kippen nur teilweise; der Aktionsraum (Skala 0,03, Filter) wirkt stärker. Nicht als Basis; Budget-Frage für das kleine Netz (EXP-024-Rezept × 4096/600) offen. Für die NPU: 220 kB int8, passt.'
