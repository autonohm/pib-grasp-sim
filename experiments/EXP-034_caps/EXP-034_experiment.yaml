hypothese: 'EXP-027 ist unruhig (Unruhe an den Servos 0,66, EXP-024 mit Filter 0,17).
  Die Strafe action_rate_l2 wirkt auf die verrauschte Aktion und misst vor allem Exploration
  (ADR-022, Befund 2). CAPS (Mysore et al. 2021) glättet direkt den Mittelwert der
