  der Störbedingung (Gelenkwinkel 0,01 rad, FSR 0,5 N, letzte Aktion 0); λ_T = λ_S
  = 0,04 (Kurztraining: ≈ 10 % des Actor-Gradienten zu Beginn). Env wie EXP-027 (Task
  HeavyMultiProgressDexCaps-v0).'
