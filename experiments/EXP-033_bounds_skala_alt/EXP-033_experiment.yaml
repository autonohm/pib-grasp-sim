ergebnis: 'Leistung 79 % [74–84] (ggü. EXP-027 kein gesicherter Unterschied, P = 0,54), 4/5 Seeds (s46: hält, aber gekippt); Kippwinkel 30° (EXP-027 44°, EXP-022 20°, EXP-024 13°), Unterarm 34° (51° / 25° / 11°), Robust 55 % (38 %), Unruhe an den Servos 0,42 (0,66), Objektweg 124 mm. Index v3 seitlich 0,17 (EXP-027 0,06).'
urteil: 'kein Unterschied, Leitplanke verletzt — erklärt das Kippen nur zum Teil (bestätigt 2026-10-14)'
schluss: 'Die kleinere Unterarm-/Handgelenkskala erklärt das Kippen nur zum Teil (44° → 30°). Reihenfolge über die Rezepte mit Skala 0,03: Filter (EXP-024) 13° < Begrenzung ±1 (EXP-022) 20° < nur bounds_loss (EXP-033) 30° — je weniger das Rauschen der relativen Aktion am Unterarm aufsummiert werden kann, desto weniger kippt die Policy (Vermutung: gekippte Haltegriffe werden durch die Drift früh gefunden). bounds_loss ist kein Ersatz für die Begrenzung. Nächster Schritt im Sinne „Steuerung über Kosten“: Kippen bzw. Unterarmabweichung direkt bepreisen (offen).'
