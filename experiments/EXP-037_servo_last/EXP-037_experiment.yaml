# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: Ohne Sicht auf die Last kann die Policy das Moment nur über Gelenkwinkel
  und FSR erraten. Der ST3215 meldet seine Last („Present Load“); sieht die Policy
  sie, hält sie die Stall-Grenze genauer und mit weniger Leistungsverlust als EXP-035.
aenderung: Beobachtung servo_load = |τ|/Stall je Servo (8, wie „Present Load“), Verlauf
  5, Rauschen σ 0,05, als letzte Größe (Policy-Eingang 105 → 145; env_cfg.add_servo_load_obs,
  Bewertung mit --servo_last). Task HeavyMultiProgressDexLagrangeLoad-v0.
